name: Audited checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests (109/109)
        # tests/test_live.py is excluded on purpose: it makes real requests
        # to public APIs (Nominatim, OSRM, Open-Meteo) and is not hermetic.
        run: |
          python3 -m unittest \
            tests.test_alerts \
            tests.test_app \
            tests.test_geo \
            tests.test_traffic \
            tests.test_trip \
            tests.test_voice \
            tests.test_weather

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets
        run: |
          set -e
          echo "Scanning for common secret patterns..."
          ! grep -rnE "AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY|sk_(live|test)_[A-Za-z0-9]+|xox[bap]-[A-Za-z0-9-]+|-----BEGIN" \
            --include="*.py" --include="*.txt" --include="*.md" --include="*.yml" --exclude="audited-checks.yml" .
          echo "No secrets found."
